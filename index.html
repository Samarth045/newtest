<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a84ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Money Control">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg">
<title>My Money Control</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#111;--muted:#74747c;--line:#e2e2e8;--blue:#0a84ff;--green:#30a46c;--red:#e5484d;--orange:#f5a524;--purple:#7c5cff}
@media(prefers-color-scheme:dark){:root:not(.light){--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#aaa;--line:#343438}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;padding-bottom:90px}
main{max-width:680px;margin:auto;padding:12px 14px 30px}.top{display:flex;justify-content:space-between;align-items:center;padding:8px 2px 14px}.brand{font-size:25px;font-weight:800;letter-spacing:-.5px}.sub{color:var(--muted);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:10px 0;box-shadow:0 2px 12px #0000000a}.hero{background:linear-gradient(135deg,#0a84ff,#6557e8);color:white;border:0;box-shadow:0 12px 30px #0a84ff38}.hero .sub{color:#ffffffb8}
.big{font-size:31px;font-weight:800;letter-spacing:-1px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{padding:14px;border-radius:16px;background:var(--bg);border:1px solid var(--line)}.metric b{display:block;font-size:18px;margin-top:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:var(--muted)}.positive{color:var(--green)}.negative{color:var(--red)}.warning{color:var(--orange)}
button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.btn{background:var(--blue);color:#fff;border-radius:13px;padding:11px 14px;font-weight:700}.btn.secondary{background:var(--bg);color:var(--text);border:1px solid var(--line)}.btn.danger{background:var(--red)}.btn.small{padding:7px 10px;border-radius:10px;font-size:12px}
input,select,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px;margin:5px 0 9px;outline:none}label{font-size:12px;color:var(--muted)}
.tabs{position:fixed;z-index:20;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:7px 5px calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:center}.tabs button{background:none;color:var(--muted);flex:1;max-width:130px;padding:5px;font-size:11px}.tabs span{display:block;font-size:21px;margin-bottom:2px}.tabs .active{color:var(--blue);font-weight:800}
.fab{position:fixed;z-index:21;right:20px;bottom:86px;width:58px;height:58px;border-radius:29px;background:var(--blue);color:#fff;font-size:30px;box-shadow:0 8px 24px #0a84ff55}
.tx{padding:12px 0;border-bottom:1px solid var(--line)}.tx:last-child{border-bottom:0}.icon{width:38px;height:38px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:18px;flex:none}.txleft{display:flex;align-items:center;min-width:0}.txdesc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.amount{font-weight:800;white-space:nowrap}
.bar{height:9px;background:var(--line);border-radius:6px;overflow:hidden;margin:9px 0}.bar i{display:block;height:100%;border-radius:6px;background:var(--blue)}
.chart{display:flex;align-items:flex-end;gap:5px;height:150px;padding:12px 4px 2px}.chartCol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}.chartBar{width:100%;max-width:24px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--blue),var(--purple));min-height:3px}.chartLabel{font-size:9px;color:var(--muted);margin-top:6px;white-space:nowrap}.chartValue{font-size:8px;color:var(--muted);margin-bottom:3px;min-height:10px}.backupOk{color:var(--green);font-weight:700}.backupWarn{color:var(--orange);font-weight:700}
.chip{display:inline-block;padding:6px 10px;border-radius:20px;background:var(--bg);border:1px solid var(--line);margin:3px;font-size:12px}.empty{text-align:center;padding:35px 15px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:flex-end}.sheet{width:100%;max-width:680px;margin:auto;background:var(--card);border-radius:24px 24px 0 0;padding:18px;max-height:92vh;overflow:auto}.sheet h2{margin:0 0 14px}.sheet .actions{display:flex;gap:8px}.sheet .actions button{flex:1}
.search{position:sticky;top:0;background:var(--bg);padding:4px 0 8px;z-index:5}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}.sectionTitle{font-size:18px;font-weight:800;margin:18px 2px 8px}.month{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}.month button{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 12px}
.notice{padding:10px 12px;border-radius:12px;background:#f5a5241a;color:var(--orange);font-size:12px}
@media(min-width:700px){body{padding-bottom:30px}.tabs{position:sticky;top:0;bottom:auto;max-width:680px;margin:auto;border:0;background:transparent}.fab{right:calc(50% - 325px)}}
</style>
</head>
<body>
<main id="app"></main>
<button class="fab" onclick="openTx()">+</button>
<nav class="tabs" id="tabs"></nav>
<div id="modal"></div>
<script>
const KEY="mmc_pwa_v2", OUT=["expense","investment","emi","saving"], TYPES=["expense","income","investment","emi","saving","transfer","borrow","payback"];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const money=n=>"₹"+Math.round(Number(n)||0).toLocaleString("en-IN");
const localDate=()=>{let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}; const localDateTime=()=>{let d=new Date();return localDate()+"T"+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}; const today=localDate, thisMonth=()=>today().slice(0,7);
const icon=n=>({food:"🍽️",dining:"🍽️",transport:"🚗",petrol:"⛽",shopping:"🛍️",bill:"💡",utility:"💡",health:"💊",entertainment:"🎬",education:"🎓",rent:"🏠",subscription:"🔁",family:"👨‍👩‍👧",investment:"📈",emi:"🏦",saving:"💰",salary:"💵",transfer:"↔️",borrow:"🤝",payback:"↩️"}[String(n||"").toLowerCase()]||"💳");
function seed(){return{accounts:[
{id:"boi",name:"BOI",opening:0,minBalance:0,note:""},
{id:"hdfc",name:"HDFC",opening:0,minBalance:0,note:"Salary"},
{id:"kotak",name:"Kotak",opening:0,minBalance:0,note:"Reserve"},
{id:"icici",name:"ICICI",opening:0,minBalance:0,note:""},
{id:"cash",name:"Cash",opening:0,minBalance:0,note:""}
],budgets:{},tx:[],recurring:[],goals:[],theme:"auto"}}
let S=JSON.parse(localStorage.getItem(KEY)||"null")||seed();
function migrateState(){if(!S.accounts)S.accounts=[];S.accounts.forEach(a=>{if(a.minBalance===undefined)a.minBalance=0});if(!S.accounts.some(a=>a.id==="boi"))S.accounts.unshift({id:"boi",name:"BOI",opening:0,minBalance:0,note:""});if(!S.budgets)S.budgets={};if(!S.tx)S.tx=[];if(!S.recurring)S.recurring=[];if(!S.goals)S.goals=[];localStorage.setItem(KEY,JSON.stringify(S))}
migrateState();
let tab="home",month=thisMonth(),query="";
function save(makeBackup=true){localStorage.setItem(KEY,JSON.stringify(S));if(makeBackup)queueSnapshot()}
const IDB_NAME="MyMoneyControlBackup",IDB_STORE="snapshots",IDB_VERSION=1;
function idb(){return new Promise((resolve,reject)=>{if(!("indexedDB" in window))return reject(new Error("IndexedDB unavailable"));let r=indexedDB.open(IDB_NAME,IDB_VERSION);r.onupgradeneeded=()=>{let db=r.result;if(!db.objectStoreNames.contains(IDB_STORE)){let st=db.createObjectStore(IDB_STORE,{keyPath:"id",autoIncrement:true});st.createIndex("createdAt","createdAt")}};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
let backupQueued=false;
function queueSnapshot(){if(backupQueued)return;backupQueued=true;setTimeout(async()=>{backupQueued=false;try{let db=await idb(),tx=db.transaction(IDB_STORE,"readwrite"),st=tx.objectStore(IDB_STORE);st.add({createdAt:new Date().toISOString(),data:JSON.stringify(S)});await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});let db2=await idb(),tx2=db2.transaction(IDB_STORE,"readwrite"),st2=tx2.objectStore(IDB_STORE),all=await new Promise((res,rej)=>{let q=st2.getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});if(all.length>30){all.sort((a,b)=>a.createdAt.localeCompare(b.createdAt));all.slice(0,all.length-30).forEach(x=>st2.delete(x.id))}}catch(e){}} ,250)}
async function latestBackup(){try{let db=await idb(),tx=db.transaction(IDB_STORE,"readonly"),q=tx.objectStore(IDB_STORE).getAll();let all=await new Promise((res,rej)=>{q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});all.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));return all[0]||null}catch(e){return null}}
async function restoreLatest(){let b=await latestBackup();if(!b)return alert("No automatic backup is available yet.");try{let d=JSON.parse(b.data);if(!d.accounts||!d.tx)throw 0;if(!confirm("Restore the latest automatic backup from "+new Date(b.createdAt).toLocaleString()+"? Current data will be replaced."))return;S=d;save();render();alert("Automatic backup restored successfully.")}catch(e){alert("The automatic backup could not be restored.")}}
async function recoverLocalBackup(){if(localStorage.getItem(KEY))return;let b=await latestBackup();if(!b)return;try{let d=JSON.parse(b.data);if(d.accounts&&d.tx){S=d;localStorage.setItem(KEY,JSON.stringify(S));render()}}catch(e){}}

function acc(id){return S.accounts.find(a=>a.id===id)||{name:"Unknown",opening:0,minBalance:0}}
function inMonth(t,m){return t.date.slice(0,7)===m}
function balance(id){let v=Number(acc(id).opening)||0;for(const t of S.tx){if(t.type==="income"&&t.account===id)v+=t.amount;if(OUT.includes(t.type)&&t.account===id)v-=t.amount;if(["transfer","borrow","payback"].includes(t.type)){if(t.account===id)v-=t.amount;if(t.to===id)v+=t.amount}}return v}
function sum(m,fn){return S.tx.filter(t=>inMonth(t,m)&&fn(t)).reduce((a,t)=>a+t.amount,0)}
function outflow(m){return sum(m,t=>OUT.includes(t.type))}
function income(m){return sum(m,t=>t.type==="income")}
function netWorth(){return S.accounts.reduce((a,x)=>a+balance(x.id),0)}
function budgetList(m){return S.budgets[m]||[]}
function spent(m,name){return sum(m,t=>OUT.includes(t.type)&&t.category===name)}
function fmtMonth(m){return new Date(m+"-01").toLocaleString("en-IN",{month:"long",year:"numeric"})}
function shiftMonth(d){let [y,n]=month.split("-").map(Number);n+=d;if(n>12){n=1;y++}if(n<1){n=12;y--}month=y+"-"+String(n).padStart(2,"0");render()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function typeLabel(t){return t.charAt(0).toUpperCase()+t.slice(1)}
function txFiltered(){return S.tx.filter(t=>inMonth(t,month)&&(!query||[t.description,t.category,t.type,acc(t.account).name].join(" ").toLowerCase().includes(query.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date))}
function nav(){document.getElementById("tabs").innerHTML=[["home","🏠","Home"],["tx","🧾","Transactions"],["budget","🎯","Budget"],["accounts","🏦","Accounts"],["more","⚙️","More"]].map(x=>'<button class="'+(tab===x[0]?"active":"")+'" onclick="tab=\''+x[0]+'\';render()"><span>'+x[1]+'</span>'+x[2]+"</button>").join("")}
function header(){return '<div class="top"><div><div class="brand">My Money Control</div><div class="sub">Private • Offline-first • On this device</div></div><button class="btn small secondary" onclick="openQuick()">Quick Add</button></div>'}
function monthBar(){return '<div class="month"><button onclick="shiftMonth(-1)">‹</button><b>'+fmtMonth(month)+'</b><button onclick="shiftMonth(1)">›</button></div>'}
function home(){let inc=income(month),out=outflow(month),bud=budgetList(month),plan=bud.reduce((a,b)=>a+b.amount,0),pct=inc?out/inc*100:plan?out/plan*100:0;let balances=S.accounts.map(a=>{let b=balance(a.id),low=Number(a.minBalance)>0&&b<Number(a.minBalance);return '<div class="row" style="padding:7px 0"><span>'+esc(a.name)+(low?' <span class="warning">⚠</span>':'')+'</span><b class="'+(b<0?"negative":low?"warning":"")+'">'+money(b)+'</b></div>'}).join("");let recent=S.tx.filter(t=>inMonth(t,month)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(txRow).join("")||'<div class="empty">No transactions yet.<br>Tap + to add your first transaction.</div>';return header()+monthBar()+
'<div class="card hero"><div class="sub">NET CASH FLOW</div><div class="big">'+money(inc-out)+'</div><div class="sub">Income '+money(inc)+' • Outflow '+money(out)+'</div><div class="bar"><i style="width:'+Math.min(pct,100)+'%;background:white"></i></div><div class="sub">'+Math.round(pct)+'% of available monthly income/plan used</div></div>'+
'<div class="grid"><div class="metric"><span class="muted">Bank money</span><b>'+money(netWorth())+'</b></div><div class="metric"><span class="muted">Investments</span><b>'+money(sum(month,t=>t.type==="investment"))+'</b></div><div class="metric"><span class="muted">EMIs</span><b>'+money(sum(month,t=>t.type==="emi"))+'</b></div><div class="metric"><span class="muted">Savings</span><b>'+money(sum(month,t=>t.type==="saving"))+'</b></div></div>'+
'<div class="sectionTitle">Live spending trend</div><div class="card">'+spendingChart()+'</div>'+
'<div class="sectionTitle">Accounts</div><div class="card">'+balances+'<hr><div class="row"><b>Total</b><b>'+money(netWorth())+'</b></div></div>'+
'<div class="sectionTitle">Plan vs actual</div><div class="card"><div class="row"><span>Planned allocation</span><b>'+money(plan)+'</b></div><div class="row" style="margin-top:7px"><span>Actual outflow</span><b>'+money(out)+'</b></div><div class="row" style="margin-top:7px"><span>Remaining plan</span><b class="'+(plan-out<0?"negative":"positive")+'">'+money(plan-out)+'</b></div><div class="sub" style="margin-top:8px">Planned amounts are budgets; only saved transactions count as actual.</div></div><div class="sectionTitle">Budget pulse</div>'+budgetCards(3)+
'<div class="sectionTitle">Recent transactions</div><div class="card">'+recent+'</div>'}
function spendingChart(){let days=[],d=new Date(month+"-01T00:00:00");let end=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();let max=0;for(let i=1;i<=end;i++){let ds=month+"-"+String(i).padStart(2,"0");let v=sum(month,t=>OUT.includes(t.type)&&t.date.slice(0,10)===ds);days.push({d:i,v});if(v>max)max=v}let step=Math.max(1,Math.ceil(end/14));let shown=[];for(let i=0;i<end;i+=step)shown.push(days[i]);return '<div class="chart">'+shown.map(x=>'<div class="chartCol"><div class="chartValue">'+(x.v?money(x.v):'')+'</div><div class="chartBar" title="'+x.d+' '+money(x.v)+'" style="height:'+Math.max(3,max?x.v/max*105:3)+'px"></div><div class="chartLabel">'+x.d+'</div></div>').join("")+'</div><div class="row muted"><span>Daily outflow</span><span>Peak '+money(max)+'</span></div>'}
function budgetCards(limit){let b=budgetList(month).slice(0,limit);if(!b.length)return '<div class="card empty">No budgets for this month.<br><button class="btn small" onclick="tab=\'budget\';render()">Create budget</button></div>';return b.map(x=>{let s=spent(month,x.name),p=x.amount?s/x.amount*100:0,c=p>100?"var(--red)":p>=80?"var(--orange)":"var(--green)";return '<div class="card"><div class="row"><b>'+esc(x.name)+'</b><span class="muted">'+money(s)+' / '+money(x.amount)+'</span></div><div class="bar"><i style="width:'+Math.min(p,100)+'%;background:'+c+'"></i></div><div class="row muted"><span>'+Math.round(p)+'% used</span><span>'+money(Math.max(0,x.amount-s))+' left</span></div></div>'}).join("")}
function txRow(t){let sign=t.type==="income"?"+":OUT.includes(t.type)?"-":"";return '<div class="tx"><div class="row"><div class="txleft"><div class="icon">'+icon(t.category||t.type)+'</div><div><div class="txdesc"><b>'+esc(t.description||t.category||typeLabel(t.type))+'</b></div><div class="sub">'+t.date+' • '+typeLabel(t.type)+' • '+esc(acc(t.account).name)+(t.to?" → "+esc(acc(t.to).name):"")+(t.needWant?" • "+esc(t.needWant):"")+'</div></div></div><div style="text-align:right"><div class="amount '+(sign==="-"?"negative":sign==="+"?"positive":"")+'">'+sign+money(t.amount)+'</div><button class="btn small secondary" onclick="openTx(\''+t.id+'\')">Edit</button></div></div></div>'}
function transactions(){return header()+monthBar()+'<div class="search"><input placeholder="Search transactions…" value="'+esc(query)+'" oninput="query=this.value;render()"></div><div class="card">'+(txFiltered().map(txRow).join("")||'<div class="empty">No matching transactions.</div>')+'</div>'}
function budget(){let plan=budgetList(month).reduce((a,b)=>a+Number(b.amount||0),0),actual=outflow(month);return header()+monthBar()+'<div class="card hero"><div class="sub">MONTHLY PLAN</div><div class="big">'+money(plan)+'</div><div class="sub">Actual outflow '+money(actual)+' • Remaining '+money(plan-actual)+'</div></div>'+budgetCards(99)+'<button class="btn" style="width:100%;margin-top:4px" onclick="openBudget()">+ Add budget</button>'}
function accounts(){return header()+'<div class="card hero"><div class="sub">TOTAL AVAILABLE MONEY</div><div class="big">'+money(netWorth())+'</div><div class="sub">Calculated from opening balances + every connected transaction</div></div>'+S.accounts.map(a=>{let b=balance(a.id),min=Number(a.minBalance)||0,short=Math.max(0,min-b);return '<div class="card"><div class="row"><div><b>'+esc(a.name)+'</b><div class="sub">'+esc(a.note||"")+'</div></div><b class="'+(short>0?"warning":"positive")+'">'+money(b)+'</b></div><div class="sub" style="margin-top:8px">Minimum balance: '+money(min)+(short>0?' • Short by '+money(short):' • ✓ minimum maintained')+'</div><hr><button class="btn small secondary" onclick="openAccount(\''+a.id+'\')">Edit account</button></div>'}).join("")+'<button class="btn" style="width:100%" onclick="openAccount()">+ Add account</button>}
function more(){let dues=S.recurring.filter(r=>!S.tx.some(t=>t.recurringId===r.id&&inMonth(t,month)));return header()+
'<div class="sectionTitle">Plan setup</div><div class="card"><div class="sub">Create monthly budgets for your planned allocation. Actual transactions stay separate from the plan.</div><button class="btn" style="width:100%;margin-top:9px" onclick="tab=\'budget\';render()">Open monthly plan</button></div>'+
'<div class="sectionTitle">Financial health</div><div class="grid"><div class="metric"><span class="muted">Savings rate</span><b>'+Math.round((income(month)?(sum(month,t=>t.type==="saving")+sum(month,t=>t.type==="investment"))/income(month)*100:0))+'%</b></div><div class="metric"><span class="muted">Needs</span><b>'+money(sum(month,t=>OUT.includes(t.type)&&t.needWant==="Need"))+'</b></div><div class="metric"><span class="muted">Wants</span><b>'+money(sum(month,t=>OUT.includes(t.type)&&t.needWant==="Want"))+'</b></div><div class="metric"><span class="muted">Recurring due</span><b>'+dues.length+'</b></div></div>'+
'<div class="sectionTitle">Recurring payments</div><div class="card">'+(S.recurring.map(r=>'<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)"><span><b>'+esc(r.name)+'</b><div class="sub">'+r.frequency+' • '+money(r.amount)+' • '+esc(acc(r.account).name)+'</div></span><button class="btn small '+(dues.some(x=>x.id===r.id)?"":"secondary")+'" onclick="markPaid(\''+r.id+'\')">'+(dues.some(x=>x.id===r.id)?"Mark Paid":"Paid")+'</button></div>').join("")||'<div class="empty">No recurring payments.</div>')+'<button class="btn secondary" style="width:100%;margin-top:10px" onclick="openRecurring()">+ Add recurring</button></div>'+
'<div class="sectionTitle">Automatic protection</div><div class="card"><div class="row"><span><b>Local automatic backup</b><div class="sub">A snapshot is created after changes and the latest 30 are retained on this device.</div></span><span class="backupOk">● ON</span></div><hr><button class="btn secondary" style="width:100%;margin-bottom:7px" onclick="restoreLatest()">Restore latest automatic backup</button><div class="sub">GitHub stores the app code, not your private financial records.</div></div>'+
'<div class="sectionTitle">Backup & data</div><div class="card"><button class="btn" style="width:100%;margin-bottom:7px" onclick="backup()">Export JSON backup</button><button class="btn secondary" style="width:100%;margin-bottom:7px" onclick="csv()">Export CSV</button><button class="btn secondary" style="width:100%;margin-bottom:7px" onclick="document.getElementById(\'file\').click()">Import JSON</button><input id="file" type="file" accept=".json" style="display:none" onchange="restore(this)"><button class="btn danger" style="width:100%" onclick="resetAll()">Reset all data</button></div>'+
'<div class="sectionTitle">App</div><div class="card"><select onchange="theme(this.value)"><option value="auto">Theme: Auto</option><option value="light">Light</option><option value="dark">Dark</option></select><div class="notice">All financial data is stored locally in this browser. GitHub hosts only the app code.</div></div>'}
function render(){let h=tab==="home"?home():tab==="tx"?transactions():tab==="budget"?budget():tab==="accounts"?accounts():more();document.getElementById("app").innerHTML=h;nav()}
function openQuick(){openTx(null,"expense")}
function options(arr,val){return arr.map(x=>'<option value="'+esc(x)+'" '+(x===val?"selected":"")+'>'+typeLabel(x)+'</option>').join("")}
function categoryOptions(type){let m={income:["Salary","Bonus","Freelance","Interest","Refund","Other"],expense:["Food & Dining","Transport","Shopping","Bills & Utilities","Health","Entertainment","Education","Rent","Subscriptions","Family","Petrol","Personal","Electricity","Other"],investment:["Mutual Fund SIP","Gold SIP","Stocks","Other Investment"],emi:["Bike EMI","Education EMI","Home Loan EMI","Personal Loan EMI","Other EMI"],saving:["Emergency Fund","General Savings","LIC","Other Saving"],transfer:["Account Transfer"],borrow:["Borrow"],payback:["Payback"]};return (m[type]||["Other"]).map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join("")}
function openTx(id,pre){let t=S.tx.find(x=>x.id===id)||{id:"",type:pre||"expense",amount:"",description:"",category:"",account:S.accounts[0]?.id||"",to:S.accounts[1]?.id||"",needWant:"Need",date:localDateTime(),notes:""};document.getElementById("modal").innerHTML='<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet"><h2>'+(id?"Edit transaction":"Add transaction")+'</h2><label>Amount</label><input id="a_amt" type="number" step="0.01" min="0" inputmode="decimal" value="'+esc(t.amount)+'" placeholder="0.00"><label>Type</label><select id="a_type" onchange="txTypeChange()">'+options(TYPES,t.type)+'</select><label>Category</label><select id="a_cat"><option value="">Select category</option>'+categoryOptions(t.type)+'<option value="__custom">Other / custom</option></select><input id="a_custom" placeholder="Custom category (optional)" style="display:none" value="'+esc(t.category)+'"><label>Description</label><input id="a_desc" value="'+esc(t.description)+'" placeholder="Lunch, Salary, SIP…"><label>Account</label><select id="a_acc">'+S.accounts.map(a=>'<option value="'+a.id+'" '+(a.id===t.account?"selected":"")+'>'+esc(a.name)+'</option>').join("")+'</select><div id="toField"><label>To account (transfer/borrow/payback)</label><select id="a_to">'+S.accounts.map(a=>'<option value="'+a.id+'" '+(a.id===t.to?"selected":"")+'>'+esc(a.name)+'</option>').join("")+'</select></div><div id="nwField"><label>Need / Want</label><select id="a_nw">'+options(["Need","Want","Investment","Family","Emergency","Other"],t.needWant)+'</select></div><label>Date</label><input id="a_date" type="datetime-local" value="'+esc(t.date)+'"><label>Notes</label><textarea id="a_notes" rows="2">'+esc(t.notes||"")+'</textarea><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveTx(\''+id+'\')">Save</button></div>'+(id?'<button class="btn danger" style="width:100%;margin-top:8px" onclick="deleteTx(\''+id+'\')">Delete transaction</button>':'')+'</div></div>';let cat=document.getElementById("a_cat"),custom=document.getElementById("a_custom");if(cat&&custom){cat.value="__custom";let preset=[...cat.options].map(o=>o.value);if(preset.includes(t.category))cat.value=t.category;custom.style.display=cat.value==="__custom"?"block":"none";cat.onchange=()=>custom.style.display=cat.value==="__custom"?"block":"none"}txTypeChange()}
function txTypeChange(){let type=document.getElementById("a_type").value,tr=["transfer","borrow","payback"].includes(type),out=OUT.includes(type);document.getElementById("toField").style.display=tr?"block":"none";document.getElementById("nwField").style.display=out?"block":"none"}
function saveTx(id){let amount=Number(document.getElementById("a_amt").value);if(!(amount>0))return alert("Enter an amount greater than 0.");let type=document.getElementById("a_type").value,account=document.getElementById("a_acc").value,to=document.getElementById("a_to").value;if(["transfer","borrow","payback"].includes(type)&&account===to)return alert("Choose different accounts.");let selectedCategory=document.getElementById("a_cat").value,customCategory=document.getElementById("a_custom").value.trim(),category=selectedCategory==="__custom"?customCategory:selectedCategory;let o={id:id||uid(),amount,type,category:category||type,description:document.getElementById("a_desc").value.trim()||category||type,account,to,needWant:document.getElementById("a_nw").value,date:document.getElementById("a_date").value,notes:document.getElementById("a_notes").value};let i=S.tx.findIndex(x=>x.id===o.id);if(i>=0)S.tx[i]=o;else S.tx.push(o);save();closeModal();render()}
function deleteTx(id){if(!confirm("Delete this transaction? This cannot be undone unless you restore a backup."))return;S.tx=S.tx.filter(x=>x.id!==id);save();closeModal();render()}
function openBudget(name){let b=budgetList(month).find(x=>x.name===name)||{name:"",amount:"",kind:"expense"};document.getElementById("modal").innerHTML='<div class="overlay"><div class="sheet"><h2>'+(name?"Edit budget":"Add budget")+'</h2><label>Name</label><input id="b_name" value="'+esc(b.name)+'"><label>Monthly amount</label><input id="b_amt" type="number" min="0" value="'+esc(b.amount)+'"><label>Type</label><select id="b_kind">'+options(["expense","investment","emi","saving"],b.kind)+'</select><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveBudget(\''+esc(name||"")+'\')">Save</button></div>'+(name?'<button class="btn danger" style="width:100%;margin-top:8px" onclick="deleteBudget(\''+esc(name)+'\')">Delete budget</button>':'')+'</div></div>'}
function saveBudget(old){let name=document.getElementById("b_name").value.trim(),amount=Number(document.getElementById("b_amt").value);if(!name||amount<0)return alert("Enter a valid budget.");let arr=budgetList(month);if(old){let i=arr.findIndex(x=>x.name===old);if(i>=0)arr[i]={name,amount,kind:document.getElementById("b_kind").value}}else arr.push({name,amount,kind:document.getElementById("b_kind").value});S.budgets[month]=arr;save();closeModal();render()}
function deleteBudget(name){if(!confirm("Delete this budget?"))return;S.budgets[month]=budgetList(month).filter(x=>x.name!==name);save();closeModal();render()}
function openAccount(id){let a=S.accounts.find(x=>x.id===id)||{id:"",name:"",opening:0,note:""};document.getElementById("modal").innerHTML='<div class="overlay"><div class="sheet"><h2>'+(id?"Edit account":"Add account")+'</h2><label>Name</label><input id="c_name" value="'+esc(a.name)+'"><label>Opening balance</label><input id="c_open" type="number" min="0" value="'+a.opening+'"><label>Minimum balance rule</label><input id="c_min" type="number" min="0" value="'+(a.minBalance||0)+'" placeholder="0 = no minimum"><label>Purpose</label><input id="c_note" value="'+esc(a.note||"")+'"><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveAccount(\''+id+'\')">Save</button></div>'+(id?'<button class="btn danger" style="width:100%;margin-top:8px" onclick="deleteAccount(\''+id+'\')">Delete account</button>':'')+'</div></div>'}
function saveAccount(id){let name=document.getElementById("c_name").value.trim();if(!name)return alert("Enter account name.");let o={id:id||uid(),name,opening:Number(document.getElementById("c_open").value)||0,minBalance:Number(document.getElementById("c_min").value)||0,note:document.getElementById("c_note").value.trim()};let i=S.accounts.findIndex(x=>x.id===o.id);if(i>=0)S.accounts[i]=o;else S.accounts.push(o);save();closeModal();render()}
function deleteAccount(id){if(S.tx.some(t=>t.account===id||t.to===id))return alert("This account has transactions. Rename it instead of deleting it.");if(!confirm("Delete account?"))return;S.accounts=S.accounts.filter(a=>a.id!==id);save();closeModal();render()}
function openRecurring(){document.getElementById("modal").innerHTML='<div class="overlay"><div class="sheet"><h2>Add recurring payment</h2><label>Name</label><input id="r_name" placeholder="Rent / SIP / EMI"><label>Amount</label><input id="r_amt" type="number" min="0"><label>Type</label><select id="r_type">'+options(["expense","investment","emi","saving"],"expense")+'</select><label>Account</label><select id="r_acc">'+S.accounts.map(a=>'<option value="'+a.id+'">'+esc(a.name)+'</option>').join("")+'</select><label>Frequency</label><select id="r_freq"><option>Monthly</option><option>Weekly</option><option>Yearly</option></select><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveRecurring()">Save</button></div></div></div>'}
function saveRecurring(){let name=document.getElementById("r_name").value.trim(),amount=Number(document.getElementById("r_amt").value);if(!name||amount<=0)return alert("Enter name and amount.");S.recurring.push({id:uid(),name,amount,type:document.getElementById("r_type").value,account:document.getElementById("r_acc").value,frequency:document.getElementById("r_freq").value});save();closeModal();render()}
function markPaid(id){let r=S.recurring.find(x=>x.id===id);if(!r)return;if(S.tx.some(t=>t.recurringId===id&&inMonth(t,month)))return alert("Already marked paid for this month.");S.tx.push({id:uid(),amount:r.amount,type:r.type,category:r.name,description:r.name,account:r.account,to:"",needWant:r.type==="investment"?"Investment":"Need",date:month===thisMonth()?localDateTime():month+"-01T09:00",notes:"Recurring payment",recurringId:id});save();render()}
function backup(){let blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="MyMoneyControl-backup-"+today()+".json";a.click()}
function csv(){let rows=[["Date","Type","Category","Description","Account","To","Need/Want","Amount"],...S.tx.map(t=>[t.date,t.type,t.category,t.description,acc(t.account).name,t.to?acc(t.to).name:"",t.needWant,t.amount])];let text=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/csv"}));a.download="MyMoneyControl-transactions.csv";a.click()}
function restore(input){let f=input.files[0];if(!f)return;f.text().then(x=>{try{let d=JSON.parse(x);if(!d.accounts||!d.tx)throw 0;if(confirm("OK = replace current data. Cancel = merge transactions.")){S=d}else{let ids=new Set(S.tx.map(t=>t.id));(d.tx||[]).forEach(t=>{if(!ids.has(t.id))S.tx.push(t)});(d.accounts||[]).forEach(a=>{if(!S.accounts.some(x=>x.id===a.id))S.accounts.push(a)});Object.assign(S.budgets,d.budgets||{})}save();render();alert("Backup restored.")}catch(e){alert("Invalid backup file.")}})}
function resetAll(){if(!confirm("Erase all local financial data?"))return;S=seed();save(false);render()}
function theme(v){S.theme=v;document.documentElement.classList.toggle("light",v==="light");if(v==="dark")document.documentElement.style.colorScheme="dark";else document.documentElement.style.colorScheme="light";if(v==="auto")document.documentElement.style.colorScheme="normal";save()}
function closeModal(){document.getElementById("modal").innerHTML=""}
document.documentElement.classList.toggle("light",S.theme==="light");if(S.theme==="dark")document.documentElement.style.colorScheme="dark";
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
recoverLocalBackup();
render();
</script>
</body></html>
