<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#101828;--muted:#667085;--line:#e4e7ec;--blue:#1570ef;--blue2:#155eef;--green:#12b76a;--red:#f04438;--orange:#f79009;--purple:#7f56d9;--cyan:#06aed4;--shadow:0 8px 30px rgba(16,24,40,.06)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;padding-bottom:94px}
body.dark{--bg:#0b0f16;--card:#151b25;--text:#f2f4f7;--muted:#98a2b3;--line:#293241;--shadow:0 10px 35px rgba(0,0,0,.28)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;padding:0 14px 28px}.top{position:sticky;top:0;z-index:10;margin:0 -14px;padding:14px 14px 12px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(22px);display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:850;letter-spacing:-.7px}.sub{color:var(--muted);font-size:12px}.btn{border:0;border-radius:13px;padding:11px 14px;font-weight:750;background:var(--blue);color:#fff;box-shadow:0 5px 16px rgba(21,112,239,.18)}.btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:none}.btn.ghost{background:transparent;color:var(--text);box-shadow:none}.btn.danger{background:var(--red)}.btn.small{padding:8px 10px;border-radius:10px;font-size:12px}.iconBtn{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.month{display:flex;align-items:center;justify-content:space-between;margin:7px 0 12px}.month button{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:21px}.month b{font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:10px 0;box-shadow:var(--shadow)}.hero{background:linear-gradient(135deg,#0a84ff 0%,#5147e8 100%);border:0;color:#fff;box-shadow:0 18px 42px rgba(21,112,239,.24)}.hero .sub{color:#dbeafe}.big{font-size:34px;font-weight:850;letter-spacing:-1.5px;margin:3px 0 2px}.heroGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.heroStat{padding:12px;border-radius:15px;background:#ffffff18;border:1px solid #ffffff22}.heroStat b{display:block;margin-top:4px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:15px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}.metric b{display:block;font-size:19px;margin-top:5px}.sectionTitle{font-size:18px;font-weight:850;margin:21px 2px 8px;letter-spacing:-.2px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.wrap{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:7px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:12px}.positive{color:var(--green)}.negative{color:var(--red)}.warning{color:var(--orange)}.muted{color:var(--muted)}hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.progress{height:9px;background:var(--line);border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--purple))}
.spark{height:120px;display:flex;align-items:flex-end;gap:4px;padding:8px 0}.sparkCol{flex:1;display:flex;align-items:flex-end;height:100%}.sparkBar{width:100%;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#1570ef,#7f56d9);min-height:3px}.legend{display:flex;gap:15px;font-size:12px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}.blueDot{background:var(--blue)}.redDot{background:var(--red)}
.tx{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}.tx:last-child{border-bottom:0}.txIcon{width:43px;height:43px;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-size:20px;flex:none}.txMain{min-width:0;flex:1}.txDesc{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.amount{font-weight:850;white-space:nowrap}.dateGroup{font-size:12px;color:var(--muted);font-weight:750;padding-top:10px}
.search{position:sticky;top:66px;z-index:8;background:var(--bg);padding:5px 0 8px}.search input{margin:0}
input,select,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:13px;padding:12px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1570ef18}label{display:block;font-size:12px;color:var(--muted);font-weight:650;margin:8px 0 4px}
.tabs{position:fixed;z-index:30;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(22px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:7px 5px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -8px 25px rgba(16,24,40,.05)}.tabs button{flex:1;max-width:140px;border:0;background:none;color:var(--muted);padding:5px 2px;font-size:10px;font-weight:650}.tabs span{display:block;font-size:20px;margin-bottom:2px}.tabs .active{color:var(--blue);font-weight:850}.fab{position:fixed;z-index:31;right:max(18px,calc(50% - 350px));bottom:87px;width:58px;height:58px;border:0;border-radius:50%;background:var(--blue);color:#fff;font-size:30px;box-shadow:0 12px 28px rgba(21,112,239,.35)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:100;display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-width:760px;max-height:94vh;overflow:auto;background:var(--card);color:var(--text);border-radius:26px 26px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.25)}.sheet h2{margin:0 0 5px;font-size:21px}.sheetHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.actions{display:flex;gap:8px;margin-top:13px}.actions>*{flex:1}
.empty{text-align:center;padding:34px 12px;color:var(--muted)}.notice{padding:11px 13px;border-radius:14px;background:#f7900914;color:var(--orange);font-size:12px}.success{padding:11px 13px;border-radius:14px;background:#12b76a14;color:var(--green);font-size:12px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi .metric{padding:12px}.kpi .metric b{font-size:16px}.miniTable .row{padding:10px 0;border-bottom:1px solid var(--line)}.miniTable .row:last-child{border-bottom:0}
.alloc{display:grid;grid-template-columns:1fr 105px 38px;gap:7px;align-items:center;margin:7px 0}.alloc button{height:42px;border-radius:12px}.deleteMini{border:1px solid var(--line);background:var(--card);color:var(--red)}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}.toggle:last-child{border:0}.toggle input{width:46px;height:25px}
@media(min-width:700px){body{padding-bottom:25px}.tabs{position:sticky;top:0;bottom:auto;max-width:760px;margin:auto;border:0;background:transparent;box-shadow:none}.fab{right:calc(50% - 350px)}.sheet{border-radius:26px;margin-bottom:20px}}
</style>

<body>
<div class="app" id="app"></div>
<button class="fab" onclick="openTx()">+</button>
<nav class="tabs" id="tabs"></nav>
<div id="modal"></div>
<script>
window.addEventListener("error",e=>{const el=document.getElementById("app");if(el&&(!el.innerHTML||el.innerHTML.trim()===""))el.innerHTML='<div class="card empty"><h2>My Money Control</h2><p>Recovered from a local app error.</p><button class="btn" onclick="location.reload()">Reload app</button></div>';});
const KEY="mmc_pwa_v2";
const TX_KEY=KEY+"_transactions";
const OUT=["expense","investment","emi","saving"];
const TYPES=["expense","income","investment","emi","saving","transfer","borrow","payback"];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const n=x=>Number(x)||0;
const money=x=>"₹"+Math.round(n(x)).toLocaleString("en-IN");
const dateLocal=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dateTimeLocal=()=>{const d=new Date();return dateLocal()+"T"+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const today=dateLocal, thisMonth=()=>today().slice(0,7);
const icons={food:"🍽️",dining:"🍽️",transport:"🚗",petrol:"⛽",shopping:"🛍️",bill:"💡",utility:"💡",health:"💊",entertainment:"🎬",education:"🎓",rent:"🏠",subscription:"🔁",family:"👨‍👩‍👧",investment:"📈",emi:"🏦",saving:"💰",salary:"💵",transfer:"↔️",borrow:"🤝",payback:"↩️",gold:"🪙",lic:"🛡️"};
function ico(x){x=String(x||"").toLowerCase();for(const k in icons)if(x.includes(k))return icons[k];return "💳"}
function seed(){return{version:11,accounts:[{id:"boi",name:"BOI",opening:0,minBalance:0,note:""},{id:"hdfc",name:"HDFC",opening:0,minBalance:20000,note:"Salary"},{id:"kotak",name:"Kotak",opening:0,minBalance:0,note:"Reserve"},{id:"cash",name:"Cash",opening:0,minBalance:0,note:""}],budgets:{},tx:[],recurring:[],goals:[],settings:{theme:"auto",dailyReminder:false,budgetAlerts:true}}}
let S=seed();
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(parsed&&typeof parsed==="object")S=parsed}}catch(e){try{localStorage.removeItem(KEY)}catch(_){} }
function migrate(){if(!S||typeof S!=="object")S=seed();if(!Array.isArray(S.accounts))S.accounts=[];S.accounts=S.accounts.filter(a=>a&&a.id!=="icici");if(!S.accounts.some(a=>a.id==="boi"))S.accounts.unshift({id:"boi",name:"BOI",opening:0,minBalance:0,note:""});S.accounts.forEach(a=>{if(a.minBalance===undefined)a.minBalance=0;if(a.id==="hdfc"&&n(a.minBalance)===0)a.minBalance=20000});if(!S.budgets||typeof S.budgets!=="object"||Array.isArray(S.budgets))S.budgets={};if(!Array.isArray(S.tx))S.tx=[];if(!Array.isArray(S.recurring))S.recurring=[];if(!Array.isArray(S.goals))S.goals=[];if(!S.settings||typeof S.settings!=="object")S.settings={};if(!S.settings.theme)S.settings.theme="auto";if(S.settings.dailyReminder===undefined)S.settings.dailyReminder=false;if(S.settings.budgetAlerts===undefined)S.settings.budgetAlerts=true;S.version=11;
try{
  const txRaw=localStorage.getItem(TX_KEY);
  if(txRaw){
    const txParsed=JSON.parse(txRaw);
    if(Array.isArray(txParsed)) S.tx=txParsed;
  }else{
    localStorage.setItem(TX_KEY,JSON.stringify(S.tx));
  }
  localStorage.setItem(KEY,JSON.stringify(S));
}catch(e){}
}
migrate();
let tab="home",month=thisMonth(),query="",toastTimer;
const IDB_NAME="MyMoneyControlBackup",IDB_STORE="snapshots",IDB_VERSION=2;
function idb(){return new Promise((resolve,reject)=>{if(!("indexedDB"in window))return reject(0);const r=indexedDB.open(IDB_NAME,IDB_VERSION);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE,{keyPath:"id",autoIncrement:true})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
let backupQueued=false;
function save(snapshot=true,mode="replace"){
  const previous=localStorage.getItem(KEY);
  if(snapshot&&previous)queueBackup(previous);

  try{
    const latestTxRaw=localStorage.getItem(TX_KEY);
    const latestTx=latestTxRaw?JSON.parse(latestTxRaw):[];
    const currentTx=Array.isArray(S.tx)?S.tx:[];
    if(mode==="tx"){
      const merged=new Map(latestTx.map(t=>[t.id,t]));
      currentTx.forEach(t=>merged.set(t.id,t));
      S.tx=Array.from(merged.values());
    }else if(Array.isArray(latestTx)){
      // Non-transaction changes must never overwrite a newer transaction ledger.
      S.tx=latestTx;
    }
    localStorage.setItem(TX_KEY,JSON.stringify(S.tx));
  }catch(e){}

  localStorage.setItem(KEY,JSON.stringify(S));
  toast("Saved")
}
function queueBackup(data){if(backupQueued)return;backupQueued=true;setTimeout(async()=>{backupQueued=false;try{const db=await idb(),tx=db.transaction(IDB_STORE,"readwrite");tx.objectStore(IDB_STORE).add({createdAt:new Date().toISOString(),data:data||JSON.stringify(S),kind:"pre-change"});await new Promise((r,j)=>{tx.oncomplete=r;tx.onerror=()=>j(tx.error)});const db2=await idb(),q=db2.transaction(IDB_STORE,"readwrite").objectStore(IDB_STORE).getAll();q.onsuccess=()=>{const a=q.result.sort((x,y)=>x.createdAt.localeCompare(y.createdAt));a.slice(0,Math.max(0,a.length-40)).forEach(x=>db2.transaction(IDB_STORE,"readwrite").objectStore(IDB_STORE).delete(x.id))}}catch(e){}},180)}
async function latestBackup(){try{const db=await idb(),q=db.transaction(IDB_STORE,"readonly").objectStore(IDB_STORE).getAll();return await new Promise((r,j)=>{q.onsuccess=()=>r(q.result.sort((a,b)=>b.createdAt.localeCompare(a.createdAt))[0]||null);q.onerror=()=>j(q.error)})}catch(e){return null}}
async function restoreLatest(){const b=await latestBackup();if(!b)return toast("No automatic backup available");if(!confirm("Restore backup from "+new Date(b.createdAt).toLocaleString()+"? Current data will be replaced."))return;S=JSON.parse(b.data);migrate();render();toast("Backup restored")}
function toast(msg){clearTimeout(toastTimer);let el=document.getElementById("toast");if(!el){el=document.createElement("div");el.id="toast";el.style.cssText="position:fixed;z-index:200;left:50%;bottom:105px;transform:translateX(-50%);background:#101828;color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:750;box-shadow:0 8px 25px #0004";document.body.appendChild(el)}el.textContent=msg;el.style.display="block";toastTimer=setTimeout(()=>el.style.display="none",1800)}
function acc(id){return S.accounts.find(a=>a.id===id)||{name:"Unknown",opening:0,minBalance:0}}
function inMonth(t,m){return String(t.date||"").slice(0,7)===m}
function balance(id){let v=n(acc(id).opening);for(const t of S.tx){if(t.type==="income"&&t.account===id)v+=n(t.amount);if(OUT.includes(t.type)&&t.account===id)v-=n(t.amount);if(["transfer","borrow","payback"].includes(t.type)){if(t.account===id)v-=n(t.amount);if(t.to===id)v+=n(t.amount)}}return v}
function sum(m,fn){return S.tx.filter(t=>inMonth(t,m)&&fn(t)).reduce((a,t)=>a+n(t.amount),0)}
function income(m){return sum(m,t=>t.type==="income")}function outflow(m){return sum(m,t=>OUT.includes(t.type))}
function invested(m){return sum(m,t=>t.type==="investment")}function saved(m){return sum(m,t=>t.type==="saving")}
function netWorth(){return S.accounts.reduce((a,x)=>a+balance(x.id),0)}
function budgets(m){return S.budgets[m]||[]}
function normText(v){return String(v||"").toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]+/g," ").trim().replace(/\s+/g," ")}
const PLAN_ALIASES={"mf sip":["mf sip","mutual fund sip"],"grt gold sip":["grt gold sip","gold sip"],"gold sip":["gold sip","grt gold sip"]};
function spent(m,name){
  const key=normText(name);
  const aliases=PLAN_ALIASES[key]||[key];
  return sum(m,t=>OUT.includes(t.type)&&[t.category,t.description].some(v=>aliases.includes(normText(v))));
}
function fmtMonth(m){return new Date(m+"-01T00:00:00").toLocaleString("en-IN",{month:"long",year:"numeric"})}
function shiftMonth(d){let [y,m]=month.split("-").map(Number);m+=d;if(m>12){m=1;y++}if(m<1){m=12;y--}month=y+"-"+String(m).padStart(2,"0");render()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function options(a,v){return a.map(x=>'<option value="'+esc(x)+'" '+(x===v?"selected":"")+'>'+esc(x.charAt(0).toUpperCase()+x.slice(1))+'</option>').join("")}
function monthBar(){return '<div class="month"><button onclick="shiftMonth(-1)">‹</button><b>'+fmtMonth(month)+'</b><button onclick="shiftMonth(1)">›</button></div>'}
function header(){return '<div class="top"><div><div class="brand">My Money Control</div><div class="sub">Private • Offline-first • Your device</div></div><button class="btn small secondary" onclick="openTx()">Quick Add</button></div>'}
function nav(){document.getElementById("tabs").innerHTML=[["home","⌂","Home"],["tx","▤","Activity"],["budget","◉","Plan"],["accounts","▣","Accounts"],["more","✦","More"]].map(x=>'<button class="'+(tab===x[0]?"active":"")+'" onclick="tab=\''+x[0]+'\';render()"><span>'+x[1]+'</span>'+x[2]+'</button>').join("")}
function home(){const inc=income(month),out=outflow(month),inv=invested(month),sav=saved(month),plan=budgets(month).reduce((a,b)=>a+n(b.amount),0),remaining=plan-out;const use=inc?out/inc*100:plan?out/plan*100:0;const low=S.accounts.filter(a=>n(a.minBalance)>balance(a.id));return header()+monthBar()+
'<div class="card hero"><div class="sub">AVAILABLE MONEY</div><div class="big">'+money(netWorth())+'</div><div class="sub">Across '+S.accounts.length+' accounts</div><div class="heroGrid"><div class="heroStat"><span class="sub">Income</span><b>'+money(inc)+'</b></div><div class="heroStat"><span class="sub">Outflow</span><b>'+money(out)+'</b></div><div class="heroStat"><span class="sub">Invested</span><b>'+money(inv)+'</b></div><div class="heroStat"><span class="sub">Saved</span><b>'+money(sav)+'</b></div></div></div>'+
(low.length?'<div class="notice">⚠ '+low.map(a=>esc(a.name)+' below '+money(a.minBalance)).join(" • ")+'</div>':'<div class="success">✓ All account minimum-balance rules are currently maintained.</div>')+
'<div class="sectionTitle">Money overview</div><div class="grid2"><div class="metric"><span class="muted">Net cash flow</span><b class="'+(inc-out<0?"negative":"positive")+'">'+money(inc-out)+'</b><div class="sub">Income − outflow</div></div><div class="metric"><span class="muted">Savings + investing</span><b>'+money(sav+inv)+'</b><div class="sub">'+(inc?Math.round((sav+inv)/inc*100):0)+'% of income</div></div><div class="metric"><span class="muted">Plan remaining</span><b class="'+(remaining<0?"negative":"positive")+'">'+money(remaining)+'</b><div class="sub">Planned '+money(plan)+'</div></div><div class="metric"><span class="muted">Needs / Wants</span><b>'+money(sum(month,t=>OUT.includes(t.type)&&t.needWant==="Need"))+' / '+money(sum(month,t=>OUT.includes(t.type)&&t.needWant==="Want"))+'</b><div class="sub">Need / Want</div></div></div>'+
'<div class="sectionTitle">Daily outflow</div><div class="card">'+chart()+'</div>'+
'<div class="sectionTitle">Budget health</div>'+budgetHealth(4)+
'<div class="sectionTitle">Accounts</div><div class="card">'+S.accounts.map(a=>{const b=balance(a.id),min=n(a.minBalance),low=min>b;return '<div class="row" style="padding:8px 0"><span>'+ico(a.name)+' '+esc(a.name)+'</span><b class="'+(low?"warning":b<0?"negative":"")+'">'+money(b)+'</b></div>'}).join("")+'</div>'+
'<div class="sectionTitle">Recent activity</div><div class="card">'+recent(5)+'</div>'}
function chart(){
  const [yy,mm]=month.split("-").map(Number);
  const days=new Date(yy,mm,0).getDate();
  const vals=[]; let max=0,total=0;
  for(let i=1;i<=days;i++){
    const ds=month+"-"+String(i).padStart(2,"0");
    const v=sum(month,t=>OUT.includes(t.type)&&String(t.date||"").slice(0,10)===ds);
    vals.push({day:i,value:v}); max=Math.max(max,v); total+=v;
  }
  const visible=vals.filter(x=>x.value>0);
  const bars=vals.map(x=>{
    const h=max>0?(x.value/max)*92:2;
    return '<div class="sparkCol" title="'+String(x.day).padStart(2,"0")+' '+fmtMonth(month)+' • '+money(x.value)+'"><div class="sparkBar" style="height:'+Math.max(2,h)+'px"></div></div>';
  }).join("");
  return '<div class="spark" style="height:118px;gap:3px">'+bars+'</div><div class="row muted"><span>'+total+' total across '+visible.length+' spending day'+(visible.length===1?"":"s")+'</span><span>Peak '+money(max)+'</span></div>';
}
function budgetHealth(limit){const b=budgets(month).slice(0,limit);if(!b.length)return '<div class="card empty">No monthly plan yet.<br><button class="btn small" onclick="openPlanner()">Build October-style allocation</button></div>';return b.map(x=>{const s=spent(month,x.name),p=n(x.amount)?s/n(x.amount)*100:0;return '<div class="card"><div class="row"><b>'+esc(x.name)+'</b><span class="'+(p>100?"negative":p>=80?"warning":"positive")+'">'+Math.round(p)+'%</span></div><div class="progress"><i style="width:'+Math.min(100,p)+'%;background:'+(p>100?"var(--red)":p>=80?"var(--orange)":"linear-gradient(90deg,var(--blue),var(--purple))")+'"></i></div><div class="row sub"><span>'+money(s)+' actual</span><span>'+money(Math.max(0,n(x.amount)-s))+' left</span></div></div>'}).join("")}
function recent(limit){const a=S.tx.filter(t=>inMonth(t,month)).sort((x,y)=>String(y.date).localeCompare(String(x.date))).slice(0,limit);return a.length?a.map(txRow).join(""):'<div class="empty">No transactions yet.<br>Tap + to record salary, spending, SIPs, EMIs or savings.</div>'}
function txRow(t){const sign=t.type==="income"?"+":OUT.includes(t.type)?"−":"";return '<div class="tx"><div class="txIcon">'+ico(t.category||t.type)+'</div><div class="txMain"><div class="txDesc">'+esc(t.description||t.category||t.type)+'</div><div class="sub">'+new Date(t.date).toLocaleDateString("en-IN",{day:"2-digit",month:"short"})+' • '+esc(acc(t.account).name)+(t.to?" → "+esc(acc(t.to).name):"")+(t.needWant?" • "+esc(t.needWant):"")+'</div></div><div style="text-align:right"><div class="amount '+(sign==="−"?"negative":sign==="+"?"positive":"")+'">'+sign+money(t.amount)+'</div><button class="btn small secondary" onclick="openTx(\''+t.id+'\')">Edit</button></div></div>'}
function transactions(){const a=S.tx.filter(t=>String(t.date).slice(0,7)===month&&(!query||[t.description,t.category,t.type,acc(t.account).name].join(" ").toLowerCase().includes(query.toLowerCase()))).sort((x,y)=>String(y.date).localeCompare(String(x.date)));return header()+monthBar()+'<div class="search"><input placeholder="Search salary, rent, SIP, account…" value="'+esc(query)+'" oninput="query=this.value;render()"></div><div class="kpi"><div class="metric"><span class="muted">Income</span><b class="positive">'+money(income(month))+'</b></div><div class="metric"><span class="muted">Outflow</span><b class="negative">'+money(outflow(month))+'</b></div><div class="metric"><span class="muted">Entries</span><b>'+a.length+'</b></div></div><div class="card">'+(a.length?a.map(txRow).join(""):'<div class="empty">No matching transactions.</div>')+'</div>'}
function budget(){const b=budgets(month),plan=b.reduce((a,x)=>a+n(x.amount),0),actual=outflow(month);return header()+monthBar()+'<div class="card hero"><div class="sub">MONTHLY PLAN</div><div class="big">'+money(plan)+'</div><div class="sub">Actual '+money(actual)+' • Remaining '+money(plan-actual)+'</div></div><div class="card"><div class="row"><b>Allocation planner</b><button class="btn small" onclick="openPlanner()">Build / edit plan</button></div><div class="sub" style="margin-top:7px">Plan first. Record actual payments separately. Your dashboard compares both automatically.</div></div>'+(b.length?b.map(x=>{const s=spent(month,x.name),p=n(x.amount)?s/n(x.amount)*100:0;return '<div class="card" onclick="openBudget(\''+esc(x.name)+'\')"><div class="row"><b>'+esc(x.name)+'</b><span>'+money(s)+' / '+money(x.amount)+'</span></div><div class="progress"><i style="width:'+Math.min(p,100)+'%;background:'+(p>100?"var(--red)":p>=80?"var(--orange)":"var(--green)")+'"></i></div><div class="row sub"><span>'+Math.round(p)+'% used</span><span>'+money(Math.max(0,n(x.amount)-s))+' remaining</span></div></div>'}).join(""):'<div class="empty">No budgets for '+fmtMonth(month)+'.<br>Use Allocation Planner.</div>')+'<button class="btn secondary" style="width:100%" onclick="openBudget()">+ Add single plan item</button>'}
function accounts(){return header()+'<div class="card hero"><div class="sub">TOTAL AVAILABLE MONEY</div><div class="big">'+money(netWorth())+'</div><div class="sub">Opening balances + connected transactions</div></div>'+S.accounts.map(a=>{const b=balance(a.id),min=n(a.minBalance),short=Math.max(0,min-b);return '<div class="card"><div class="row"><div><b style="font-size:17px">'+ico(a.name)+' '+esc(a.name)+'</b><div class="sub">'+esc(a.note||"")+'</div></div><b class="'+(short?"warning":b<0?"negative":"positive")+'">'+money(b)+'</b></div><hr><div class="row sub"><span>Minimum balance</span><b>'+money(min)+'</b></div><div class="row sub" style="margin-top:6px"><span>'+ (short?"⚠ Reserve shortfall":"✓ Rule status")+'</span><b class="'+(short?"warning":"positive")+'">'+(short?"−"+money(short):"Maintained")+'</b></div><button class="btn small secondary" style="margin-top:12px" onclick="openAccount(\''+a.id+'\')">Edit account</button></div>'}).join("")+'<button class="btn" style="width:100%" onclick="openAccount()">+ Add account</button>'}
function more(){const due=S.recurring.filter(r=>!S.tx.some(t=>t.recurringId===r.id&&inMonth(t,month)));const goalTotal=S.goals.reduce((a,g)=>a+n(g.target),0),goalSaved=S.goals.reduce((a,g)=>a+n(g.saved),0);return header()+
'<div class="sectionTitle">Financial insights</div><div class="grid2"><div class="metric"><span class="muted">Savings rate</span><b>'+Math.round((income(month)?(saved(month)+invested(month))/income(month)*100:0))+'%</b></div><div class="metric"><span class="muted">Recurring due</span><b>'+due.length+'</b></div><div class="metric"><span class="muted">Goals</span><b>'+S.goals.length+'</b></div><div class="metric"><span class="muted">Goal progress</span><b>'+money(goalSaved)+' / '+money(goalTotal)+'</b></div></div>'+
'<div class="sectionTitle">Goals</div><div class="card">'+(S.goals.length?S.goals.map(g=>{const p=n(g.target)?Math.min(100,n(g.saved)/n(g.target)*100):0;return '<div style="padding:8px 0"><div class="row"><b>'+esc(g.name)+'</b><span>'+money(g.saved)+' / '+money(g.target)+'</span></div><div class="progress"><i style="width:'+p+'%;background:var(--green)"></i></div><div class="row sub"><span>'+Math.round(p)+'%</span><button class="btn small secondary" onclick="openGoal(\''+g.id+'\')">Edit</button></div></div>'}).join(""):'<div class="empty">Create an emergency fund, house, car or other goal.</div>')+'<button class="btn secondary" style="width:100%;margin-top:8px" onclick="openGoal()">+ Add goal</button></div>'+
'<div class="sectionTitle">Recurring payments</div><div class="card">'+(S.recurring.length?S.recurring.map(r=>{const paid=!due.some(x=>x.id===r.id);return '<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><span><b>'+esc(r.name)+'</b><div class="sub">'+money(r.amount)+' • '+r.frequency+' • '+esc(acc(r.account).name)+'</div></span><span><button class="btn small '+(paid?"secondary":"")+'" onclick="markPaid(\''+r.id+'\')">'+(paid?"Paid":"Mark Paid")+'</button><button class="btn small ghost" onclick="deleteRecurring(\''+r.id+'\')">✕</button></span></div>'}).join(""):'<div class="empty">No recurring items.</div>')+'<button class="btn secondary" style="width:100%;margin-top:10px" onclick="openRecurring()">+ Add recurring</button></div>'+
'<div class="sectionTitle">Data protection</div><div class="card"><div class="success">✓ Automatic local snapshots are enabled. Up to 40 recent snapshots are retained on this device.</div><button class="btn secondary" style="width:100%;margin-top:9px" onclick="restoreLatest()">Restore latest snapshot</button><hr><button class="btn" style="width:100%;margin-bottom:7px" onclick="backup()">Export full JSON backup</button><button class="btn secondary" style="width:100%;margin-bottom:7px" onclick="csv()">Export transactions CSV</button><button class="btn secondary" style="width:100%" onclick="document.getElementById(\'file\').click()">Import JSON backup</button><input id="file" type="file" accept=".json" style="display:none" onchange="restore(this)"><div class="sub" style="margin-top:9px">Transactions are stored in a dedicated local ledger so adding one entry cannot replace earlier entries. GitHub hosts the application code. Private financial records stay in this browser unless you export them.</div></div>'+
'<div class="sectionTitle">App settings</div><div class="card"><label>Theme</label><select onchange="setTheme(this.value)"><option value="auto" '+(S.settings.theme==="auto"?"selected":"")+'>System</option><option value="light" '+(S.settings.theme==="light"?"selected":"")+'>Light</option><option value="dark" '+(S.settings.theme==="dark"?"selected":"")+'>Dark</option></select><div class="toggle"><span><b>Budget alerts</b><div class="sub">Show warning when a plan reaches 80%.</div></span><input type="checkbox" '+(S.settings.budgetAlerts?"checked":"")+' onchange="S.settings.budgetAlerts=this.checked;save();render()"></div><div class="toggle"><span><b>Daily reminder</b><div class="sub">Browser notification support varies by device.</div></span><input type="checkbox" '+(S.settings.dailyReminder?"checked":"")+' onchange="S.settings.dailyReminder=this.checked;requestNotifications()"></div><button class="btn danger" style="width:100%;margin-top:12px" onclick="resetAll()">Reset all local data</button></div>'}
function categoryOptions(type){const m={income:["Salary","Bonus","Freelance","Interest","Refund","Other"],expense:["Food & Dining","Transport","Shopping","Bills & Utilities","Health","Entertainment","Education","Rent","Subscriptions","Family","Petrol","Personal","Electricity","Other"],investment:["Mutual Fund SIP","Gold SIP","Stocks","Other Investment"],emi:["Bike EMI","Education EMI","Home Loan EMI","Personal Loan EMI","Other EMI"],saving:["Emergency Fund","General Savings","LIC","Other Saving"],transfer:["Account Transfer"],borrow:["Borrow"],payback:["Payback"]};return (m[type]||["Other"]).map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join("")}
function openTx(id,pre){const t=S.tx.find(x=>x.id===id)||{id:"",type:pre||"expense",amount:"",description:"",category:"",account:S.accounts[0]?.id||"",to:S.accounts[1]?.id||"",needWant:"Need",date:dateTimeLocal(),notes:""};document.getElementById("modal").innerHTML='<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="sheetHead"><div><h2>'+(id?"Edit transaction":"Add transaction")+'</h2><div class="sub">Every entry updates balances, plan tracking and insights.</div></div><button class="iconBtn" onclick="closeModal()">×</button></div><label>Amount</label><input id="a_amt" type="number" step="0.01" min="0.01" inputmode="decimal" value="'+esc(t.amount)+'" placeholder="0.00"><label>Type</label><select id="a_type" onchange="txTypeChange()">'+options(TYPES,t.type)+'</select><label>Category</label><select id="a_cat"><option value="">Select</option>'+categoryOptions(t.type)+'<option value="__custom">Custom</option></select><input id="a_custom" placeholder="Custom category" style="display:none" value="'+esc(t.category)+'"><label>Description</label><input id="a_desc" value="'+esc(t.description)+'" placeholder="Salary, Rent, MF SIP…"><label>From account</label><select id="a_acc">'+S.accounts.map(a=>'<option value="'+a.id+'" '+(a.id===t.account?"selected":"")+'>'+esc(a.name)+'</option>').join("")+'</select><div id="toField"><label>To account</label><select id="a_to">'+S.accounts.map(a=>'<option value="'+a.id+'" '+(a.id===t.to?"selected":"")+'>'+esc(a.name)+'</option>').join("")+'</select></div><div id="nwField"><label>Classification</label><select id="a_nw">'+options(["Need","Want","Investment","Family","Emergency","Other"],t.needWant)+'</select></div><label>Date & time</label><input id="a_date" type="datetime-local" value="'+esc(t.date)+'"><label>Notes</label><textarea id="a_notes" rows="2" placeholder="Optional notes">'+esc(t.notes||"")+'</textarea><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveTx(\''+id+'\')">Save transaction</button></div>'+(id?'<button class="btn danger" style="width:100%;margin-top:9px" onclick="deleteTx(\''+id+'\')">Delete transaction</button>':'')+'</div></div>';const cat=document.getElementById("a_cat"),custom=document.getElementById("a_custom");const preset=[...cat.options].map(o=>o.value);cat.value=preset.includes(t.category)?t.category:"__custom";custom.style.display=cat.value==="__custom"?"block":"none";cat.onchange=()=>custom.style.display=cat.value==="__custom"?"block":"none";txTypeChange()}
function txTypeChange(){const type=document.getElementById("a_type").value,tr=["transfer","borrow","payback"].includes(type),out=OUT.includes(type);document.getElementById("toField").style.display=tr?"block":"none";document.getElementById("nwField").style.display=out?"block":"none";
const cat=document.getElementById("a_cat"),custom=document.getElementById("a_custom"),label=cat?.previousElementSibling;
if(cat){const current=cat.value,previousCustom=custom?.value||"";cat.innerHTML='<option value="">Select</option>'+categoryOptions(type)+'<option value="__custom">Custom</option>';
const defaults={income:"Salary",expense:"Food & Dining",investment:"Mutual Fund SIP",emi:"Bike EMI",saving:"Emergency Fund",transfer:"Account Transfer",borrow:"Borrow",payback:"Payback"};
const wanted=current&&[...cat.options].some(o=>o.value===current)?current:defaults[type]||"";
cat.value=wanted||"__custom";if(custom){custom.value=previousCustom;custom.style.display=cat.value==="__custom"?"block":"none"}
if(label&&label.tagName==="LABEL")label.textContent=type==="income"?"Income source":type==="transfer"?"Transfer type":type==="borrow"?"Borrow type":type==="payback"?"Payback type":type==="investment"?"Investment":type==="emi"?"EMI":type==="saving"?"Saving":"Expense category"}
if(type==="income"){const acc=document.getElementById("a_acc");if(acc&&[...acc.options].some(o=>o.value==="hdfc"))acc.value="hdfc"}
}
function saveTx(id){const amount=n(document.getElementById("a_amt").value);if(amount<=0)return alert("Enter an amount greater than 0.");const type=document.getElementById("a_type").value,account=document.getElementById("a_acc").value,to=document.getElementById("a_to").value;if(["transfer","borrow","payback"].includes(type)&&account===to)return alert("Choose different accounts.");const selected=document.getElementById("a_cat").value,custom=document.getElementById("a_custom").value.trim(),category=selected==="__custom"?custom:selected;if(!category)return alert("Choose or enter a category.");const description=document.getElementById("a_desc").value.trim()||category, date=document.getElementById("a_date").value;const duplicate=S.tx.some(x=>x.id!==id&&x.type===type&&n(x.amount)===amount&&x.account===account&&(x.to||"")===(to||"")&&String(x.date)===String(date)&&String(x.description||"")===description);if(duplicate)return alert("A matching transaction already exists for this date and account.");const o={id:id||uid(),amount,type,category,description,account,to,needWant:document.getElementById("a_nw").value,date,notes:document.getElementById("a_notes").value};const i=S.tx.findIndex(x=>x.id===o.id);if(i>=0)S.tx[i]=o;else S.tx.push(o);save(true,"tx");closeModal();render()}
function deleteTx(id){const t=S.tx.find(x=>x.id===id);if(!t)return;if(!confirm("Delete this transaction? A pre-change automatic snapshot will be created so you can restore it."))return;S.tx=S.tx.filter(x=>x.id!==id);save(true,"tx");closeModal();render();toast("Transaction deleted • restore from More → Data protection if needed")}
function openBudget(name){const b=budgets(month).find(x=>x.name===name)||{name:"",amount:"",kind:"expense"};document.getElementById("modal").innerHTML='<div class="overlay"><div class="sheet"><div class="sheetHead"><h2>'+(name?"Edit plan item":"Add plan item")+'</h2><button class="iconBtn" onclick="closeModal()">×</button></div><label>Name</label><input id="b_name" value="'+esc(b.name)+'" placeholder="Rent, MF SIP, Food…"><label>Planned monthly amount</label><input id="b_amt" type="number" min="0" value="'+esc(b.amount)+'"><label>Plan type</label><select id="b_kind">'+options(["expense","investment","emi","saving"],b.kind)+'</select><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveBudget(\''+esc(name||"")+'\')">Save</button></div>'+(name?'<button class="btn danger" style="width:100%;margin-top:9px" onclick="deleteBudget(\''+esc(name)+'\')">Delete plan item</button>':'')+'</div></div>'}
function saveBudget(old){const name=document.getElementById("b_name").value.trim(),amount=n(document.getElementById("b_amt").value);if(!name||amount<0)return alert("Enter a valid plan item.");const arr=budgets(month);if(old){const i=arr.findIndex(x=>x.name===old);if(i>=0)arr[i]={name,amount,kind:document.getElementById("b_kind").value}}else arr.push({name,amount,kind:document.getElementById("b_kind").value});S.budgets[month]=arr;save();closeModal();render()}
function deleteBudget(name){if(!confirm("Delete this plan item? Existing transactions stay untouched."))return;S.budgets[month]=budgets(month).filter(x=>x.name!==name);save();closeModal();render()}
function openPlanner(){const defaults=[["MF SIP",20000,"investment"],["GRT Gold SIP",20000,"investment"],["Bike EMI",9361,"emi"],["Education EMI",5000,"emi"],["Rent",22500,"expense"],["Petrol",2000,"expense"],["Home Food",8000,"expense"],["Home Expenses",5000,"expense"],["Internet",800,"expense"],["Parents",5000,"expense"],["Personal",8000,"expense"],["Electricity",1000,"expense"],["LIC",2297,"saving"]];let rows=budgets(month).length?budgets(month).map(x=>[x.name,x.amount,x.kind]):defaults;document.getElementById("modal").innerHTML='<div class="overlay"><div class="sheet"><div class="sheetHead"><div><h2>Monthly Allocation Planner</h2><div class="sub">Set the plan once. Actual payments remain separate.</div></div><button class="iconBtn" onclick="closeModal()">×</button></div><div id="allocRows">'+rows.map((x,i)=>allocRow(x,i)).join("")+'</div><button class="btn secondary" style="width:100%" onclick="addAlloc()">+ Add line</button><div class="card" style="margin-top:12px;background:var(--bg)"><div class="row"><b>Planned total</b><b id="allocTotal">'+money(rows.reduce((a,x)=>a+n(x[1]),0))+'</b></div><div class="sub">October-style starter plan is prefilled only in the planner; nothing is saved until you tap Save.</div></div><button class="btn" style="width:100%" onclick="savePlanner()">Save monthly plan</button></div></div>'}
function allocRow(x,i){return '<div class="alloc"><input class="an" value="'+esc(x[0])+'" placeholder="Name"><input class="aa" type="number" min="0" value="'+n(x[1])+'" oninput="updateAllocTotal()"><button class="deleteMini" onclick="this.parentElement.remove();updateAllocTotal()">×</button></div>'}
function addAlloc(){document.getElementById("allocRows").insertAdjacentHTML("beforeend",allocRow(["","", "expense"],Date.now()))}
function updateAllocTotal(){let total=[...document.querySelectorAll(".aa")].reduce((a,x)=>a+n(x.value),0);document.getElementById("allocTotal").textContent=money(total)}
function savePlanner(){const names=[...document.querySelectorAll(".an")],vals=[...document.querySelectorAll(".aa")],arr=[];names.forEach((x,i)=>{const name=x.value.trim(),amount=n(vals[i].value);if(name&&amount>0)arr.push({name,amount,kind:"expense"})});S.budgets[month]=arr;save();closeModal();render();toast("Monthly plan saved")}
function openAccount(id){const a=S.accounts.find(x=>x.id===id)||{id:"",name:"",opening:0,minBalance:0,note:""};document.getElementById("modal").innerHTML='<div class="overlay"><div class="sheet"><div class="sheetHead"><h2>'+(id?"Edit account":"Add account")+'</h2><button class="iconBtn" onclick="closeModal()">×</button></div><label>Account name</label><input id="c_name" value="'+esc(a.name)+'"><label>Opening balance</label><input id="c_open" type="number" min="0" value="'+n(a.opening)+'"><label>Minimum balance rule</label><input id="c_min" type="number" min="0" value="'+n(a.minBalance)+'" placeholder="0 = no minimum"><label>Purpose</label><input id="c_note" value="'+esc(a.note||"")+'" placeholder="Salary / Reserve / Cash"><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveAccount(\''+id+'\')">Save</button></div>'+(id?'<button class="btn danger" style="width:100%;margin-top:9px" onclick="deleteAccount(\''+id+'\')">Delete account</button>':'')+'</div></div>'}
function saveAccount(id){const name=document.getElementById("c_name").value.trim();if(!name)return alert("Enter account name.");const o={id:id||uid(),name,opening:n(document.getElementById("c_open").value),minBalance:n(document.getElementById("c_min").value),note:document.getElementById("c_note").value.trim()};if(S.accounts.some(a=>a.id!==id&&a.name.toLowerCase()===name.toLowerCase()))return alert("An account with this name already exists.");const i=S.accounts.findIndex(a=>a.id===id);if(i>=0)S.accounts[i]=o;else S.accounts.push(o);save();closeModal();render()}
function deleteAccount(id){if(S.tx.some(t=>t.account===id||t.to===id))return alert("This account has transactions. Rename it instead of deleting it.");if(!confirm("Delete this account?"))return;S.accounts=S.accounts.filter(a=>a.id!==id);save();closeModal();render()}
function openGoal(id){const g=S.goals.find(x=>x.id===id)||{id:"",name:"",target:"",saved:0,deadline:""};document.getElementById("modal").innerHTML='<div class="overlay"><div class="sheet"><div class="sheetHead"><h2>'+(id?"Edit goal":"Add goal")+'</h2><button class="iconBtn" onclick="closeModal()">×</button></div><label>Goal name</label><input id="g_name" value="'+esc(g.name)+'" placeholder="Emergency Fund"><label>Target amount</label><input id="g_target" type="number" min="1" value="'+n(g.target)+'"><label>Current saved amount</label><input id="g_saved" type="number" min="0" value="'+n(g.saved)+'"><label>Target date</label><input id="g_date" type="date" value="'+esc(g.deadline||"")+'"><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveGoal(\''+id+'\')">Save</button></div>'+(id?'<button class="btn danger" style="width:100%;margin-top:9px" onclick="deleteGoal(\''+id+'\')">Delete goal</button>':'')+'</div></div>'}
function saveGoal(id){const name=document.getElementById("g_name").value.trim(),target=n(document.getElementById("g_target").value),savedAmt=n(document.getElementById("g_saved").value);if(!name||target<=0)return alert("Enter a goal and target.");const o={id:id||uid(),name,target,saved:savedAmt,deadline:document.getElementById("g_date").value};const i=S.goals.findIndex(x=>x.id===id);if(i>=0)S.goals[i]=o;else S.goals.push(o);save();closeModal();render()}
function deleteGoal(id){if(confirm("Delete this goal?")){S.goals=S.goals.filter(x=>x.id!==id);save();closeModal();render()}}
function openRecurring(){document.getElementById("modal").innerHTML='<div class="overlay"><div class="sheet"><div class="sheetHead"><h2>Add recurring</h2><button class="iconBtn" onclick="closeModal()">×</button></div><label>Name</label><input id="r_name" placeholder="Rent / MF SIP / Bike EMI"><label>Amount</label><input id="r_amt" type="number" min="0"><label>Type</label><select id="r_type">'+options(["expense","investment","emi","saving"],"expense")+'</select><label>Account</label><select id="r_acc">'+S.accounts.map(a=>'<option value="'+a.id+'">'+esc(a.name)+'</option>').join("")+'</select><label>Frequency</label><select id="r_freq"><option>Monthly</option><option>Weekly</option><option>Yearly</option></select><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveRecurring()">Save</button></div></div></div>'}
function saveRecurring(){const name=document.getElementById("r_name").value.trim(),amount=n(document.getElementById("r_amt").value);if(!name||amount<=0)return alert("Enter a valid recurring item.");S.recurring.push({id:uid(),name,amount,type:document.getElementById("r_type").value,account:document.getElementById("r_acc").value,frequency:document.getElementById("r_freq").value});save();closeModal();render()}
function markPaid(id){const r=S.recurring.find(x=>x.id===id);if(!r)return;if(S.tx.some(t=>t.recurringId===id&&inMonth(t,month)))return alert("Already marked paid for this month.");S.tx.push({id:uid(),amount:r.amount,type:r.type,category:r.name,description:r.name,account:r.account,to:"",needWant:r.type==="investment"?"Investment":"Need",date:month===thisMonth()?dateTimeLocal():month+"-01T09:00",notes:"Recurring payment",recurringId:id});save(true,"tx");render();toast(r.name+" marked paid")}
function deleteRecurring(id){if(!confirm("Delete recurring item? Existing paid transactions stay."))return;S.recurring=S.recurring.filter(x=>x.id!==id);save();render()}
function openQuick(){openTx(null,"expense")}
function backup(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));a.download="MyMoneyControl-"+today()+".json";a.click();toast("JSON backup exported")}
function csv(){const rows=[["Date","Type","Category","Description","Account","To","Classification","Amount"],...S.tx.map(t=>[t.date,t.type,t.category,t.description,acc(t.account).name,t.to?acc(t.to).name:"",t.needWant,t.amount])];const txt=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv"}));a.download="MyMoneyControl-transactions.csv";a.click();toast("CSV exported")}
function restore(input){const f=input.files[0];if(!f)return;f.text().then(txt=>{try{const d=JSON.parse(txt);if(!d.accounts||!d.tx)throw 0;if(!confirm("Replace current data with this backup?"))return;S=d;migrate();render();toast("Backup restored")}catch(e){alert("Invalid backup file.")}})}
function resetAll(){if(!confirm("Erase ALL local financial data? Export a backup first."))return;if(!confirm("Final confirmation: permanently reset this browser's finance data?"))return;S=seed();save(false);render();toast("Local data reset")}
function setTheme(v){S.settings.theme=v;applyTheme();save(false);render()}
function applyTheme(){document.body.classList.toggle("dark",S.settings.theme==="dark"||(S.settings.theme==="auto"&&matchMedia("(prefers-color-scheme:dark)").matches))}
async function requestNotifications(){S.settings.dailyReminder=true;save(false);if("Notification"in window){const p=await Notification.requestPermission();if(p!=="granted"){S.settings.dailyReminder=false;save(false);alert("Notifications were not enabled by the browser.")}}render()}
function openPlannerOrBudget(){openPlanner()}
function closeModal(){document.getElementById("modal").innerHTML=""}
function render(){applyTheme();let h=tab==="home"?home():tab==="tx"?transactions():tab==="budget"?budget():tab==="accounts"?accounts():more();document.getElementById("app").innerHTML=h;nav()}
applyTheme();
window.addEventListener("storage",e=>{
  if(!e.newValue)return;
  try{
    if(e.key===TX_KEY){
      const incomingTx=JSON.parse(e.newValue);
      if(Array.isArray(incomingTx)){
        S.tx=incomingTx;
        render();
        toast("Synced transactions");
      }
      return;
    }
    if(e.key===KEY){
      const incoming=JSON.parse(e.newValue);
      if(!incoming||typeof incoming!=="object")return;
      const localTx=Array.isArray(S.tx)?S.tx:[];
      const incomingTx=Array.isArray(incoming.tx)?incoming.tx:[];
      const latestRaw=localStorage.getItem(TX_KEY);
      const latestTx=latestRaw?JSON.parse(latestRaw):incomingTx;
      S={...incoming,tx:Array.isArray(latestTx)?latestTx:localTx};
      render();
      toast("Synced latest data");
    }
  }catch(err){}
});
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js?v=13",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{}));
render();
</script>
</body>
