<script>
window.addEventListener("error",e=>{const el=document.getElementById("app");if(el&&(!el.innerHTML||el.innerHTML.trim()===""))el.innerHTML='<div class="card empty"><h2>My Money Control</h2><p>Recovered from a local app error.</p><button class="btn" onclick="location.reload()">Reload app</button></div>';});
const KEY="mmc_pwa_v18";
const TX_KEY=KEY+"_transactions";
const TX_ITEM_PREFIX=KEY+"_tx_";
const LEGACY_KEYS=["mmc_pwa_v14","mmc_pwa_v2"];
const OUT=["expense","investment","emi","saving"];
const TYPES=["expense","income","investment","emi","saving","transfer","borrow","payback"];
const uid=()=>{try{if(crypto&&typeof crypto.randomUUID==="function")return crypto.randomUUID()}catch(e){}return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,12)+"-"+Math.random().toString(36).slice(2,12)};
const n=x=>Number(x)||0;
const money=x=>"₹"+Math.round(n(x)).toLocaleString("en-IN");
const dateLocal=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dateTimeLocal=()=>{const d=new Date();return dateLocal()+"T"+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const today=dateLocal, thisMonth=()=>today().slice(0,7);
const icons={food:"🍽️",dining:"🍽️",transport:"🚗",petrol:"⛽",shopping:"🛍️",bill:"💡",utility:"💡",health:"💊",entertainment:"🎬",education:"🎓",rent:"🏠",subscription:"🔁",family:"👨‍👩‍👧",investment:"📈",emi:"🏦",saving:"💰",salary:"💵",transfer:"↔️",borrow:"🤝",payback:"↩️",gold:"🪙",lic:"🛡️"};
function ico(x){x=String(x||"").toLowerCase();for(const k in icons)if(x.includes(k))return icons[k];return "💳"}
function seed(){return{version:14,accounts:[{id:"boi",name:"BOI",opening:0,minBalance:0,note:""},{id:"hdfc",name:"HDFC",opening:0,minBalance:20000,note:"Salary"},{id:"kotak",name:"Kotak",opening:0,minBalance:0,note:"Reserve"},{id:"cash",name:"Cash",opening:0,minBalance:0,note:""}],budgets:{},tx:[],recurring:[],goals:[],settings:{theme:"auto",dailyReminder:false,budgetAlerts:true}}}
let S=seed();
try{
  const raw=localStorage.getItem(KEY)||LEGACY_KEYS.map(k=>localStorage.getItem(k)).find(Boolean);
  if(raw){
    const parsed=JSON.parse(raw);
    if(parsed&&typeof parsed==="object")S=parsed;
  }
}catch(e){console.error("Storage migration failed",e)}
function migrate(){
  if(!S||typeof S!=="object")S=seed();
  if(!Array.isArray(S.accounts))S.accounts=[];
  S.accounts=S.accounts.filter(a=>a&&a.id!=="icici");
  if(!S.accounts.some(a=>a.id==="boi"))S.accounts.unshift({id:"boi",name:"BOI",opening:0,minBalance:0,note:""});
  S.accounts.forEach(a=>{if(a.minBalance===undefined)a.minBalance=0;if(a.id==="hdfc"&&n(a.minBalance)===0)a.minBalance=20000});
  if(!S.budgets||typeof S.budgets!=="object"||Array.isArray(S.budgets))S.budgets={};
  if(!Array.isArray(S.tx))S.tx=[];
  if(!Array.isArray(S.recurring))S.recurring=[];
  if(!Array.isArray(S.goals))S.goals=[];
  if(!S.settings||typeof S.settings!=="object")S.settings={};
  if(!S.settings.theme)S.settings.theme="auto";
  if(S.settings.dailyReminder===undefined)S.settings.dailyReminder=false;
  if(S.settings.budgetAlerts===undefined)S.settings.budgetAlerts=true;
  S.version=21;
}
migrate();
let tab="home",month=thisMonth(),query="",toastTimer;
const IDB_NAME="MyMoneyControlBackup",IDB_STORE="snapshots",IDB_VERSION=2;
function idb(){return new Promise((resolve,reject)=>{if(!("indexedDB"in window))return reject(0);const r=indexedDB.open(IDB_NAME,IDB_VERSION);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE,{keyPath:"id",autoIncrement:true})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
let backupQueued=false;
function loadTxLedger(){
  try{
    const byId=new Map();
    // Canonical ledger: each transaction has its own storage key.
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(!k||!k.startsWith(TX_ITEM_PREFIX))continue;
      const raw=localStorage.getItem(k);
      if(!raw)continue;
      try{
        const t=JSON.parse(raw);
        if(t&&t.id)byId.set(String(t.id),t);
      }catch(_){}
    }
    if(byId.size)return Array.from(byId.values());
    // One-time migration from the previous array ledger.
    for(const key of [TX_KEY,...LEGACY_KEYS.map(k=>k+"_transactions")]){
      const raw=localStorage.getItem(key);
      if(!raw)continue;
      const parsed=JSON.parse(raw);
      if(Array.isArray(parsed)){
        parsed.forEach(t=>{if(t&&t.id)byId.set(String(t.id),t)});
        if(byId.size){
          const migrated=Array.from(byId.values());
          writeTxLedger(migrated);
          return migrated;
        }
      }
    }
    return [];
  }catch(e){console.error("Transaction ledger read failed",e);return Array.isArray(S.tx)?S.tx:[]}
}
function writeTxLedger(tx){
  const next=Array.isArray(tx)?tx.filter(t=>t&&t.id):[];
  const keep=new Set(next.map(t=>String(t.id)));
  // Remove deleted transactions.
  const remove=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.startsWith(TX_ITEM_PREFIX)){
      const id=k.slice(TX_ITEM_PREFIX.length);
      if(!keep.has(id))remove.push(k);
    }
  }
  remove.forEach(k=>localStorage.removeItem(k));
  // Each entry is independently persisted; adding one can never replace another.
  next.forEach(t=>localStorage.setItem(TX_ITEM_PREFIX+String(t.id),JSON.stringify(t)));
  // Keep the legacy array only as a compatibility/migration snapshot.
  localStorage.setItem(TX_KEY,JSON.stringify(next));
}

}

const PLAN_ALIASES={"mf sip":["mf sip","mutual fund sip"],"grt gold sip":["grt gold sip","gold sip"],"gold sip":["gold sip","grt gold sip"]};
function spent(m,name){
  const key=normText(name);
  const aliases=new Set(PLAN_ALIASES[key]||[key]);
  const planWords=key.split(" ").filter(Boolean);
  return loadTxLedger().filter(t=>inMonth(t,m)&&OUT.includes(t.type)).reduce((total,t)=>{
    const fields=[normText(t.category),normText(t.description),normText(t.notes)];
    const matchesExact=fields.some(v=>v&&aliases.has(v));
    const matchesWords=fields.some(v=>v&&planWords.length&&planWords.every(w=>v.split(" ").includes(w)));
    return total+(matchesExact||matchesWords?n(t.amount):0);
  },0);

function categoryOptions(type){const m={income:["Salary","Bonus","Freelance","Interest","Refund","Other"],expense:["Food & Dining","Transport","Shopping","Bills & Utilities","Health","Entertainment","Education","Rent","Subscriptions","Family","Petrol","Personal","Electricity","Other"],investment:["Mutual Fund SIP","Gold SIP","Stocks","Other Investment"],emi:["Bike EMI","Education EMI","Home Loan EMI","Personal Loan EMI","Other EMI"],saving:["Emergency Fund","General Savings","LIC","Other Saving"],transfer:["Account Transfer"],borrow:["Borrow"],payback:["Payback"]};return (m[type]||["Other"]).map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join("")}
function openTx(id,pre){const t=S.tx.find(x=>x.id===id)||{id:"",type:pre||"expense",amount:"",description:"",category:"",account:S.accounts[0]?.id||"",to:"",needWant:"Need",date:dateTimeLocal(),notes:""};document.getElementById("modal").innerHTML='<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="sheetHead"><div><h2>'+(id?"Edit transaction":"Add transaction")+'</h2><div class="sub">Every entry updates balances, plan tracking and insights.</div></div><button class="iconBtn" onclick="closeModal()">×</button></div><label>Amount</label><input id="a_amt" type="number" step="0.01" min="0.01" inputmode="decimal" value="'+esc(t.amount)+'" placeholder="0.00"><label>Type</label><select id="a_type" onchange="txTypeChange()">'+options(TYPES,t.type)+'</select><label>Category</label><select id="a_cat"><option value="">Select</option>'+categoryOptions(t.type)+'<option value="__custom">Custom</option></select><input id="a_custom" placeholder="Custom category" style="display:none" value="'+esc(t.category)+'"><label>Description</label><input id="a_desc" value="'+esc(t.description)+'" placeholder="Salary, Rent, MF SIP…"><label>From account</label><select id="a_acc">'+S.accounts.map(a=>'<option value="'+a.id+'" '+(a.id===t.account?"selected":"")+'>'+esc(a.name)+'</option>').join("")+'</select><div id="toField"><label>To account</label><select id="a_to">'+S.accounts.map(a=>'<option value="'+a.id+'" '+(a.id===t.to?"selected":"")+'>'+esc(a.name)+'</option>').join("")+'</select></div><div id="nwField"><label>Classification</label><select id="a_nw">'+options(["Need","Want","Investment","Family","Emergency","Other"],t.needWant)+'</select></div><label>Date & time</label><input id="a_date" type="datetime-local" value="'+esc(t.date)+'"><label>Notes</label><textarea id="a_notes" rows="2" placeholder="Optional notes">'+esc(t.notes||"")+'</textarea><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveTx(\''+(id||"")+'\')">Save transaction</button></div>'+(id?'<button class="btn danger" style="width:100%;margin-top:9px" onclick="deleteTx(\''+id+'\')">Delete transaction</button>':'')+'</div></div>';const cat=document.getElementById("a_cat"),custom=document.getElementById("a_custom");const preset=[...cat.options].map(o=>o.value);cat.value=preset.includes(t.category)?t.category:"__custom";custom.style.display=cat.value==="__custom"?"block":"none";cat.onchange=()=>custom.style.display=cat.value==="__custom"?"block":"none";txTypeChange()}
function txTypeChange(){const type=document.getElementById("a_type").value,tr=["transfer","borrow","payback"].includes(type),out=OUT.includes(type);document.getElementById("toField").style.display=tr?"block":"none";document.getElementById("nwField").style.display=out?"block":"none";
const cat=document.getElementById("a_cat"),custom=document.getElementById("a_custom"),label=cat?.previousElementSibling;
if(cat){const current=cat.value,previousCustom=custom?.value||"";cat.innerHTML='<option value="">Select</option>'+categoryOptions(type)+'<option value="__custom">Custom</option>';
const defaults={income:"Salary",expense:"Food & Dining",investment:"Mutual Fund SIP",emi:"Bike EMI",saving:"Emergency Fund",transfer:"Account Transfer",borrow:"Borrow",payback:"Payback"};
const wanted=current&&[...cat.options].some(o=>o.value===current)?current:defaults[type]||"";
cat.value=wanted||"__custom";if(custom){custom.value=previousCustom;custom.style.display=cat.value==="__custom"?"block":"none"}
if(label&&label.tagName==="LABEL")label.textContent=type==="income"?"Income source":type==="transfer"?"Transfer type":type==="borrow"?"Borrow type":type==="payback"?"Payback type":type==="investment"?"Investment":type==="emi"?"EMI":type==="saving"?"Saving":"Expense category"}
if(type==="income"){const acc=document.getElementById("a_acc");if(acc&&[...acc.options].some(o=>o.value==="hdfc"))acc.value="hdfc"}
}
function saveTx(id){
  const editingId=(id && id!=="undefined" && id!=="null")?String(id):null;
  const amount=n(document.getElementById("a_amt").value);
  if(amount<=0)return alert("Enter an amount greater than 0.");
  const type=document.getElementById("a_type").value,account=document.getElementById("a_acc").value,toField=document.getElementById("a_to"),to=["transfer","borrow","payback"].includes(type)?(toField?toField.value:""):"";
  if(["transfer","borrow","payback"].includes(type)&&account===to)return alert("Choose different accounts.");
  const selected=document.getElementById("a_cat").value,custom=document.getElementById("a_custom").value.trim(),category=selected==="__custom"?custom:selected;
  if(!category)return alert("Choose or enter a category.");
  const description=document.getElementById("a_desc").value.trim()||category,date=document.getElementById("a_date").value;
  // Identical manual transactions are valid (e.g. two separate ₹100 food purchases).
  // Each entry has its own UUID, so transactions can never overwrite one another.
  const previous=localStorage.getItem(KEY);
  if(previous)queueBackup(previous);
  const o={id:editingId||uid(),amount,type,category,description,account,to,needWant:document.getElementById("a_nw").value,date,notes:document.getElementById("a_notes").value};
  localStorage.setItem(TX_ITEM_PREFIX+String(o.id),JSON.stringify(o));
  S.tx=loadTxLedger();
  localStorage.setItem(KEY,JSON.stringify({...S,tx:S.tx}));
  closeModal();render()
}
function deleteTx(id){
  const t=loadTxLedger().find(x=>x.id===id);if(!t)return;
  if(!confirm("Delete this transaction? A pre-change automatic snapshot will be created so you can restore it."))return;
  const previous=localStorage.getItem(KEY);
  if(previous)queueBackup(previous);
  localStorage.removeItem(TX_ITEM_PREFIX+String(id));
  S.tx=loadTxLedger();
  localStorage.setItem(KEY,JSON.stringify({...S,tx:S.tx}));
  closeModal();render();toast("Transaction deleted • restore from More → Data protection if needed")
}

function saveBudget(old){const name=document.getElementById("b_name").value.trim(),amount=n(document.getElementById("b_amt").value);if(!name||amount<0)return alert("Enter a valid plan item.");const arr=budgets(month);if(old){const i=arr.findIndex(x=>x.name===old);if(i>=0)arr[i]={name,amount,kind:document.getElementById("b_kind").value}}else arr.push({name,amount,kind:document.getElementById("b_kind").value});S.budgets[month]=arr;save();closeModal();render()}

function markPaid(id){
  const r=S.recurring.find(x=>x.id===id);if(!r)return;
  if(loadTxLedger().some(t=>t.recurringId===id&&inMonth(t,month)))return alert("Already marked paid for this month.");
  const tx={id:uid(),amount:r.amount,type:r.type,category:r.name,description:r.name,account:r.account,to:"",needWant:r.type==="investment"?"Investment":"Need",date:month===thisMonth()?dateTimeLocal():month+"-01T09:00",notes:"Recurring payment",recurringId:id};
  localStorage.setItem(TX_ITEM_PREFIX+String(tx.id),JSON.stringify(tx));
  S.tx=loadTxLedger();
  localStorage.setItem(KEY,JSON.stringify({...S,tx:S.tx}));
  render();toast(r.name+" marked paid");
}
function deleteRecurring(id){if(!confirm("Delete recurring item? Existing paid transactions stay."))return;S.recurring=S.recurring.filter(x=>x.id!==id);save();render()}
function openQuick(){openTx(null,"expense")}
function backup(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));a.download="MyMoneyControl-"+today()+".json";a.click();toast("JSON backup exported")}
function csv(){const rows=[["Date","Type","Category","Description","Account","To","Classification","Amount"],...S.tx.map(t=>[t.date,t.type,t.category,t.description,acc(t.account).name,t.to?acc(t.to).name:"",t.needWant,t.amount])];const txt=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv"}));a.download="MyMoneyControl-transactions.csv";a.click();toast("CSV exported")}
function restore(input){const f=input.files[0];if(!f)return;f.text().then(txt=>{try{const d=JSON.parse(txt);if(!d.accounts||!d.tx)throw 0;if(!confirm("Replace current data with this backup?"))return;const current=localStorage.getItem(KEY);if(current)queueBackup(current);S=d;migrate();writeTxLedger(S.tx);save(false,"state");render();toast("Backup restored")}catch(e){alert("Invalid backup file.")}})}
function resetAll(){if(!confirm("Erase ALL local financial data? Export a backup first."))return;if(!confirm("Final confirmation: permanently reset this browser's finance data?"))return;const current=localStorage.getItem(KEY);if(current)queueBackup(current);S=seed();save(false,"reset");render();toast("Local data reset")}
function setTheme(v){S.settings.theme=v;applyTheme();save(false);render()}
function applyTheme(){document.body.classList.toggle("dark",S.settings.theme==="dark"||(S.settings.theme==="auto"&&matchMedia("(prefers-color-scheme:dark)").matches))}
async function requestNotifications(){S.settings.dailyReminder=true;save(false);if("Notification"in window){const p=await Notification.requestPermission();if(p!=="granted"){S.settings.dailyReminder=false;save(false);alert("Notifications were not enabled by the browser.")}}render()}
function openPlannerOrBudget(){openPlanner()}
function closeModal(){document.getElementById("modal").innerHTML=""}
function render(){applyTheme();let h=tab==="home"?home():tab==="tx"?transactions():tab==="budget"?budget():tab==="accounts"?accounts():more();document.getElementById("app").innerHTML=h;nav()}
applyTheme();
window.addEventListener("storage",e=>{
  try{
    if(e.key&&e.key.startsWith(TX_ITEM_PREFIX)){
      S.tx=loadTxLedger();render();return;
    }
    if(e.key===KEY){
      const incoming=JSON.parse(e.newValue||"null");
      if(incoming&&typeof incoming==="object"){S={...incoming,tx:loadTxLedger()};render()}
    }
  }catch(err){}
});
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js?v=21",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{}));
render();
</script>
</body>
</html>
